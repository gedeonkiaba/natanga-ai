name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Web & packages — lint (a11y), typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api (NestJS) est en cours de retrait (ADR 18) : exclu des contrôles.
      - run: pnpm -r --filter '!@natanga/api' lint
      - run: pnpm -r --filter '!@natanga/api' typecheck
      - run: pnpm -r --filter '!@natanga/api' test
      - run: pnpm --filter @natanga/web build

  api:
    name: API Laravel — Pest sur PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: natanga
          POSTGRES_PASSWORD: natanga
          POSTGRES_DB: natanga_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U natanga" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api-laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # PostgreSQL = moteur de production (SQLite ne type pas les colonnes).
      - run: vendor/bin/pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: natanga_test
          DB_USERNAME: natanga
          DB_PASSWORD: natanga

  images:
    name: Images Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api-laravel/Dockerfile -t natanga-api:ci .
      - run: docker build -f apps/web/Dockerfile -t natanga-web:ci .
      # Démarrage réel de l'API (migrations + seed sur PostgreSQL, non-root) puis healthcheck.
      - name: Smoke test API container
        run: |
          docker network create natanga
          docker run -d --name db --network natanga -e POSTGRES_USER=natanga -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=natanga postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U natanga && break; sleep 1; done
          docker run -d --name api --network natanga -p 8000:8000 \
            -e APP_KEY=base64:$(head -c 32 /dev/urandom | base64) -e DB_HOST=db -e DB_DATABASE=natanga \
            -e DB_USERNAME=natanga -e DB_PASSWORD=ci -e MAIL_MAILER=log natanga-api:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  e2e:
    name: E2E navigateur (desktop + mobile, axe) sur PostgreSQL
    runs-on: ubuntu-latest
    needs: [js, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: natanga
          POSTGRES_PASSWORD: natanga
          POSTGRES_DB: natanga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U natanga" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api-laravel
      - run: pnpm --filter @natanga/web build
      - run: pnpm --filter @natanga/web exec playwright install --with-deps chromium
      - run: pnpm --filter @natanga/web test:e2e
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: natanga
          DB_USERNAME: natanga
          DB_PASSWORD: natanga
          CACHE_STORE: database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            apps/web/e2e-report
            apps/web/e2e-results
          retention-days: 14
